name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Restrict GITHUB_TOKEN to read-only at workflow level. Jobs that need
# write access (publish, deploy) declare their own `permissions:` block.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-cov pytest-asyncio hypothesis ruff

      - name: Lint with ruff
        run: ruff check redteamkit/ tests/

      - name: Run tests with coverage
        run: pytest -v --tb=short --cov=redteamkit --cov-report=term-missing

      - name: Check coverage threshold
        run: pytest --cov=redteamkit --cov-fail-under=90 -q
